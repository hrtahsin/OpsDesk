name: ci

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore OpsDesk.sln

      - name: Build
        run: dotnet build OpsDesk.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test OpsDesk.sln --configuration Release --no-build --verbosity normal
