services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: opsdesk-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-OpsDesk_Dev_2026!}"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql

volumes:
  sqlserver-data:
